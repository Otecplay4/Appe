<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Bandeja de mensajes de contacto recibidos por Olympia Gym.">
    <title>Olympia Gym | Mensajes</title>
    <link rel="stylesheet" href="CSSempresa/rutina.css?v=6">
</head>

<body>
    <div class="container">

        <div class="top-nav">
            <a href="inicio-empresa.html" class="logo-link" title="Volver al inicio">
                <img src="imagenes/olympia_dorado.png" alt="Logo de Olympia Gym">
            </a>
            <a href="inicio-empresa.html" class="volver">&larr; VOLVER AL INICIO</a>
        </div>

        <h1>MENSAJES</h1>

        <div id="mensajeInfo" class="mensaje-formulario" role="status" aria-live="polite"></div>

        <!-- Filtro de la bandeja: el script lo escucha y vuelve a dibujar las
             tarjetas. -->
        <div class="filtros">
            <label for="filtroMensajes">Mostrar:</label>
            <select id="filtroMensajes" name="filtroMensajes">
                <option value="no_leidos" selected>No leídos</option>
                <option value="leidos">Leídos</option>
                <option value="todos">Todos</option>
            </select>
        </div>

        <div id="mensajesContainer" class="grid"></div>

    </div>

    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/dom.js?v=5"></script>
    <script src="JSempresa/guardia.js?v=5"></script>
    <script src="JSempresa/mensajes.js?v=5"></script>
</body>

</html>
