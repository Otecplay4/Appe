<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Acceso del entrenador y del administrador de Olympia Gym.">
    <title>Olympia Gym | Iniciar sesión</title>
    <link rel="stylesheet" href="CSSempresa/interfaz2.css?v=6">
</head>

<body class="pagina-acceso">
    <header id="header">
        <a class="logo" href="inicio-empresa.html" title="Ir al inicio de la administración">
            <img src="imagenes/olympia_dorado.png" alt="Logo de Olympia Gym">
        </a>
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="navMenu">
            <a href="panel.html" class="nav-boton">Panel</a>
            <a href="crearplanes.html" class="nav-boton">Planes</a>
            <a href="crearproductos.html" class="nav-boton">Productos</a>
            <a href="crearrutina.html" class="nav-boton">Rutina</a>
        </nav>
    </header>

    <main class="contenido-acceso">
        <section class="texto-acceso" aria-labelledby="acceso-page-title">
            <p class="texto-chico">Administración</p>
            <h1 id="acceso-page-title">Agrega, Elimina y Modifica.</h1>
            <p>Haz que los clientes tengan una buena estadía.</p>
        </section>

        <section class="caja-acceso" aria-labelledby="register-title">
            <h2 id="register-title">Iniciar Sesión</h2>

            <!-- El script JSempresa/app2.js intercepta el envío y llama a
                 PHPempresa/iniciarentrenador.php. El `action` queda declarado
                 para que, si el script no llegara a ejecutarse, las
                 credenciales viajen por POST y no por la URL. -->
            <form id="iniciarEntrenador" class="formulario-acceso" method="post" action="PHPempresa/iniciarentrenador.php">

                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" name="correo" autocomplete="email" required>

                <label for="contrasena">Contraseña</label>
                <input id="contrasena" type="password" name="contraseña" autocomplete="current-password" required>

                <button type="submit">Iniciar Sesión</button>
                <p id="estetico">¿Sos administrador? <a href="crearentrenador.html" id="color">Creá una cuenta de entrenador</a></p>
            </form>

            <p id="div" class="mensaje-formulario" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/dom.js?v=5"></script>
    <script src="JSempresa/app2.js?v=5"></script>
    <script src="JSempresa/menu.js?v=5"></script>
</body>

</html>
