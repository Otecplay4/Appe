<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Planes de membresía de Olympia Gym: elegí la duración y contratá tu plan.">
    <title>Olympia Gym | Planes</title>
    <link rel="stylesheet" href="CSScliente/interfaz.css?v=5">
    <link rel="stylesheet" href="CSScliente/productos.css?v=5">
    <link rel="stylesheet" href="CSScliente/planes.css?v=5">
</head>
<body>
    <header>
        <a class="logo" href="Principio.html" aria-label="Inicio de Olympia Gym">
            <img src="imagenes/olympia_dorado.png" alt="Olympia Gym">
        </a>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="lado-derecho">
            <nav id="navMenu" aria-label="Navegación principal">
                <a href="planes.html" class="nav-boton">Planes</a>
                <a href="productos.html" class="nav-boton">Productos</a>
                <a href="mirutina.html" class="nav-boton">Rutina</a>
                <a href="perfil.html" class="nav-boton">Mi perfil</a>
                <a href="contacto.html" class="nav-boton">Contacto</a>
            <a href="carrito.html" class="boton-carrito">Carrito (<span id="numeroCarrito">0</span>)</a>
            </nav>
            <a href="Principio.html" class="boton-volver">← Volver</a>
        </div>
    </header>

    <main class="pagina-planes">
        <h1 class="titulo-planes">Planes</h1>

        <div class="lista-planes">

            <div class="fila-plan abierta">
                <a class="caja-plan" href="plan-1.html" data-plan="1" aria-expanded="true" aria-controls="planPanel1">
                    <img src="imagenes/plan basico.jpg" alt="Entrenamiento de fuerza del Plan Basico">
                    <span class="nombre-plan">Plan Basico</span>
                </a>

                <div class="flecha-plan" aria-hidden="true">→</div>

                <div class="detalle-plan" id="planPanel1" aria-hidden="false">
                    <h3 class="titulo-detalle">Plan Basico</h3>
                    <div class="grilla-detalle">
                            <div class="tiempo-plan">
                                <button type="button" class="boton-tiempo"
                                        data-plan-compra="1"
                                        data-periodo="semanal"
                                        data-precio="300">Semanal</button>
                                <span class="precio-tiempo">$ 300,00</span>
                            </div>
                            <div class="tiempo-plan">
                                <button type="button" class="boton-tiempo"
                                        data-plan-compra="1"
                                        data-periodo="mensual"
                                        data-precio="1200">Mensual</button>
                                <span class="precio-tiempo">$ 1.200,00</span>
                            </div>
                            <div class="tiempo-plan">
                                <button type="button" class="boton-tiempo"
                                        data-plan-compra="1"
                                        data-periodo="trimestral"
                                        data-precio="2000">Trimestral</button>
                                <span class="precio-tiempo">$ 2.000,00</span>
                            </div>
                            <div class="tiempo-plan">
                                <button type="button" class="boton-tiempo"
                                        data-plan-compra="1"
                                        data-periodo="anual"
                                        data-precio="3000">Anual</button>
                                <span class="precio-tiempo">$ 3.000,00</span>
                            </div></div>
                </div>
            </div>

            <div class="fila-plan abierta">
                <a class="caja-plan" href="plan-2.html" data-plan="2" aria-expanded="true" aria-controls="planPanel2">
                    <img src="imagenes/plan familiar.jpg" alt="Entrenamiento personalizado del Plan Familiar">
                    <span class="nombre-plan">Plan Familiar</span>
                </a>

                <div class="flecha-plan" aria-hidden="true">→</div>

                <div class="detalle-plan" id="planPanel2" aria-hidden="false">
                    <h3 class="titulo-detalle">Plan Familiar</h3>
                    <div class="grilla-detalle">
                            <div class="tiempo-plan">
                                <button type="button" class="boton-tiempo"
                                        data-plan-compra="2"
                                        data-periodo="semanal"
                                        data-precio="450">Semanal</button>
                                <span class="precio-tiempo">$ 450,00</span>
                            </div>
                            <div class="tiempo-plan">
                                <button type="button" class="boton-tiempo"
                                        data-plan-compra="2"
                                        data-periodo="mensual"
                                        data-precio="1800">Mensual</button>
                                <span class="precio-tiempo">$ 1.800,00</span>
                            </div>
                            <div class="tiempo-plan">
                                <button type="button" class="boton-tiempo"
                                        data-plan-compra="2"
                                        data-periodo="trimestral"
                                        data-precio="3000">Trimestral</button>
                                <span class="precio-tiempo">$ 3.000,00</span>
                            </div>
                            <div class="tiempo-plan">
                                <button type="button" class="boton-tiempo"
                                        data-plan-compra="2"
                                        data-periodo="anual"
                                        data-precio="4500">Anual</button>
                                <span class="precio-tiempo">$ 4.500,00</span>
                            </div></div>
                </div>
            </div>

        </div>
    </main>

    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/dom.js?v=5"></script>
    <script src="JScliente/auth.js?v=5"></script>
    <script src="JScliente/planes-comun.js?v=5"></script>
    <script src="JScliente/planes.js?v=5"></script>
    <script src="JScliente/compra-plan.js?v=5"></script>
    
    <script src="JScliente/carrito.js?v=5"></script>
    <script src="JScliente/menu.js?v=5"></script>
</body>
</html>
