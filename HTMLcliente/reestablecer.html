<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Elegí tu nueva contraseña de Olympia Gym.">
    <title>Olympia Gym | Restablecer contraseña</title>
    <link rel="stylesheet" href="CSScliente/estilo.css?v=5">
</head>
<body class="pagina-acceso">
    <header class="encabezado-navegacion">
        <a class="logo-acceso" href="Principio.html" aria-label="Ir al inicio de Olympia Gym">
            <img src="imagenes/olympia_dorado.png" alt="Olympia Gym">
        </a>
        <nav class="nav-acceso" aria-label="Navegación principal">
            <a href="planes.html">Planes</a>
            <a href="productos.html">Productos</a>
            <a href="mirutina.html">Rutina</a>
            <a href="perfil.html">Mi perfil</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="contenido-simple">
        <h1 class="titulo-pagina">RESTABLECER CONTRASEÑA</h1>

        <section class="caja-acceso" aria-labelledby="titulo-reestablecer">
            <h2 id="titulo-reestablecer">Elegí tu nueva contraseña</h2>
            <form id="formularioReestablecer" class="formulario-acceso">
                <input type="hidden" id="token" name="token" value="">

                <label for="contraseñaNueva">Contraseña nueva</label>
                <input id="contraseñaNueva" type="password" name="contraseña" autocomplete="new-password" minlength="8" required>

                <label for="contraseñaRepetida">Repetí la contraseña</label>
                <input id="contraseñaRepetida" type="password" name="confirmacion" autocomplete="new-password" minlength="8" required>

                <button type="submit">Guardar contraseña</button>
            </form>
        </section>

        <div id="reestablecerMensaje" class="mensaje-formulario" role="status" aria-live="polite"></div>

        <p class="enlace-volver"><a href="Inicio-Sesion.html">← Volver al inicio de sesión</a></p>
    </main>

    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/dom.js?v=5"></script>
    <script src="JScliente/reestablecer.js?v=5"></script>
</body>
</html>
