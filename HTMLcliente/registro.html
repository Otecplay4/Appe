<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Creá tu cuenta de Olympia Gym.">
    <title>Olympia Gym | Crear cuenta</title>
    <link rel="stylesheet" href="CSScliente/estilo.css?v=5">
</head>
<body class="pagina-acceso">
    <header class="encabezado-acceso">
        <a class="logo-acceso" href="Principio.html" aria-label="Ir al inicio de Olympia Gym">
            <img src="imagenes/olympia_dorado.png" alt="Olympia Gym">
        </a>
    </header>

    <main class="contenido-acceso">
        <section class="texto-acceso" aria-labelledby="register-page-title">
            <p class="texto-chico">Olympia Gym</p>
            <h1 id="register-page-title">Tu mejor versión empieza hoy.</h1>
            <p>Creá tu cuenta para empezar a organizar tu entrenamiento.</p>
        </section>

        <section class="caja-acceso" aria-labelledby="register-title">

            <h2 id="register-title">Registrarse</h2>
            <form id="crearCuenta" class="formulario-acceso">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" name="nombre" autocomplete="name" required>

                <label for="apellido">Apellido</label>
                <input id="apellido" type="text" name="apellido" autocomplete="family-name" required>

                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" name="correo" autocomplete="email" required>

                <label for="telefono">Teléfono (opcional)</label>
                <input id="telefono" type="tel" name="telefono" autocomplete="tel" maxlength="20">

                <label for="contraseña">Contraseña</label>
                <input id="contraseña" type="password" name="contraseña" autocomplete="new-password" minlength="8" required>

                <label for="captcha" id="captcha-pregunta">Verificación</label>
                <input id="captcha" type="text" name="captcha" inputmode="numeric" autocomplete="off" required>

                <button type="submit">Crear cuenta</button>
            </form>

            <p id="div" class="mensaje-formulario" role="status" aria-live="polite"></p>

            <p class="enlace-acceso">¿Ya tenés una cuenta? <a href="Inicio-Sesion.html">Iniciá sesión</a></p>
        </section>
    </main>

    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/dom.js?v=5"></script>
    <script src="JScliente/app.js?v=5"></script>
</body>
</html>
