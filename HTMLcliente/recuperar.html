<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recuperá el acceso a tu cuenta de Olympia Gym.">
    <title>Olympia Gym | Recuperar contraseña</title>
    <link rel="stylesheet" href="CSScliente/estilo.css?v=5">
</head>
<body class="pagina-acceso">
    <header class="encabezado-navegacion">
        <a class="logo-acceso" href="Principio.html" aria-label="Ir al inicio de Olympia Gym">
            <img src="imagenes/olympia_dorado.png" alt="Olympia Gym">
        </a>
        <nav class="nav-acceso" aria-label="Navegación principal">
            <a href="planes.html">Planes</a>
            <a href="productos.html">Productos</a>
            <a href="mirutina.html">Rutina</a>
            <a href="perfil.html">Mi perfil</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="contenido-simple">
        <h1 class="titulo-pagina">RECUPERAR CONTRASEÑA</h1>

        <section class="caja-acceso" aria-labelledby="titulo-recuperar">
            <h2 id="titulo-recuperar">¿Olvidaste tu contraseña?</h2>
            <form id="formularioRecuperar" class="formulario-acceso">
                <label for="correoRecuperar">Correo electrónico con el que te registraste</label>
                <input id="correoRecuperar" type="email" name="correo" autocomplete="email" required>

                <button type="submit">Enviar enlace de recuperación</button>
            </form>
        </section>

        <div id="recuperarMensaje" class="mensaje-formulario" role="status" aria-live="polite"></div>

        <p class="enlace-volver"><a href="Inicio-Sesion.html">← Volver al inicio de sesión</a></p>
    </main>

    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/dom.js?v=5"></script>
    <script src="JScliente/recuperar.js?v=5"></script>
</body>
</html>
