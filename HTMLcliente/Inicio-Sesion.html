<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciá sesión en Olympia Gym.">
    <title>Olympia Gym | Iniciar Sesión</title>
    <link rel="stylesheet" href="CSScliente/estilo.css?v=5">
</head>
<body class="pagina-acceso">
    <header class="encabezado-acceso">
        <a class="logo-acceso" href="Principio.html" aria-label="Ir al inicio de Olympia Gym">
            <img src="imagenes/olympia_dorado.png" alt="Olympia Gym">
        </a>
    </header>

    <main class="contenido-acceso">
        <section class="texto-acceso" aria-labelledby="login-page-title">
            <p class="texto-chico">Olympia Gym</p>
            <h1 id="login-page-title">Recupera el tiempo perdido.</h1>
            <p>Iniciá sesión para no perderte de nuevos beneficios.</p>
        </section>

        <section class="caja-acceso" aria-labelledby="login-title">

            <h2 id="login-title">Iniciar Sesión</h2>
            <form id="iniciarSesion" class="formulario-acceso">

                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" name="correo" autocomplete="email" required>

                <label for="contrasena">Contraseña</label>
                <input id="contrasena" type="password" name="contraseña" autocomplete="current-password" required>

                <button type="submit">Iniciar Sesión</button>
            </form>

            <p id="div" class="mensaje-formulario" role="status" aria-live="polite"></p>

            <p class="enlace-acceso"><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
            <p class="enlace-acceso">¿No tenés una cuenta? <a href="registro.html">Creá tu cuenta</a></p>
        </section>
    </main>

    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/dom.js?v=5"></script>
    <script src="JScliente/app.js?v=5"></script>
</body>
</html>
