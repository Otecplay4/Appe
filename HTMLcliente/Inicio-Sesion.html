<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Olympia Gym.">
    <title>Olympia Gym | Iniciar Sesión</title>
    <link rel="stylesheet" href="CSScliente/estilo.css">
</head>
<body class="pagina-acceso">
    <header class="encabezado-acceso">
        <a class="logo-acceso" href="Principio.html" aria-label="Ir al inicio de Olympia Gym">
            <img src="imagenes/olympia_dorado.png" alt="Olympia Gym">
        </a>
    </header>

    <main class="contenido-acceso">
        <section class="texto-acceso" aria-labelledby="register-page-title">
            <p class="texto-chico">Olympia Gym</p>
            <h1 id="register-page-title">Recupera el tiempo perdido.</h1>
            <p>Inicia sesión para no perderte de nuevos beneficios.</p>
        </section>

        <section class="caja-acceso" aria-labelledby="register-title">
            
            <h2 id="register-title">Iniciar Sesión</h2>
            <form id="iniciarSesion" class="formulario-acceso">

                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" name="correo" autocomplete="email" required>

                <label for="contrasena">Contraseña</label>
                <input id="contrasena" type="password" name="contraseña" autocomplete="new-password" required>

                <button type="submit">Iniciar Sesión</button>
                <p id="estetico">¿No tienes una cuenta? <a href="registro.html" id="color"> Registrarse</a></p>
            </form>
            <p id="div" class="mensaje-formulario" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="./JScliente/app.js"></script>
</body>
</html>
