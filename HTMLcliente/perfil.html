<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consultá tus datos, tu plan, tu rutina y tu estado de cuenta en Olympia Gym.">
    <title>Olympia Gym | Mi perfil</title>
    <link rel="stylesheet" href="CSScliente/estilo.css?v=5">
</head>
<body class="pagina-acceso">
    <header class="encabezado-navegacion">
        <a class="logo-acceso" href="Principio.html" aria-label="Ir al inicio de Olympia Gym">
            <img src="imagenes/olympia_dorado.png" alt="Olympia Gym">
        </a>
        <nav class="nav-acceso" aria-label="Navegación principal">
            <a href="planes.html">Planes</a>
            <a href="productos.html">Productos</a>
            <a href="mirutina.html">Rutina</a>
            <a href="perfil.html" aria-current="page">Mi perfil</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="contenido-simple">
        <h1 class="titulo-pagina">MI PERFIL</h1>

        <div id="perfilMensaje" class="mensaje-formulario" role="status" aria-live="polite"></div>

        <div id="perfilContenido" class="perfil-contenido"></div>

        <section class="caja-acceso" aria-labelledby="titulo-solicitud">
            <h2 id="titulo-solicitud">Solicitar cambio de rutina</h2>
            <form id="formularioSolicitud" class="formulario-acceso">
                <label for="motivoCambio">Contá brevemente qué querés cambiar</label>
                <textarea id="motivoCambio" name="mensaje" rows="5" maxlength="500" required></textarea>

                <button type="submit">Solicitar cambio de rutina</button>
            </form>
        </section>

        <p class="enlace-volver"><a href="Inicio.html">← Volver al inicio</a></p>
    </main>

    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/dom.js?v=5"></script>
    <script src="JScliente/auth.js?v=6"></script>
    <script src="JScliente/perfil.js?v=5"></script>
</body>
</html>
